<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Skin Merger - Working</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f7fafc;
            --bg-input: #ffffff;
            --text-primary: #1a202c;
            --text-secondary: #718096;
            --text-muted: #a0aec0;
            --border-color: #e2e8f0;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.15);
            --btn-primary: #48bb78;
            --btn-primary-hover: #38a169;
            --btn-secondary: #4299e1;
            --btn-secondary-hover: #3182ce;
            --btn-tertiary: #ed8936;
            --btn-tertiary-hover: #dd7723;
            --btn-disabled: #cbd5e0;
        }

        [data-theme="dark"] {
            --bg-primary: #1a202c;
            --bg-secondary: #2d3748;
            --bg-input: #2d3748;
            --text-primary: #f7fafc;
            --text-secondary: #cbd5e0;
            --text-muted: #718096;
            --border-color: #4a5568;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
            --btn-disabled: #4a5568;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 20px;
            position: relative;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-secondary);
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 50px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-sm);
        }

        .input-section {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-dual {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: end;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .label-secondary {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: normal;
            margin-top: 4px;
        }

        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 1rem;
            background: var(--bg-input);
            color: var(--text-primary);
            border: 2px solid var(--border-color);
            transition: border-color 0.2s ease;
        }

        input[type="text"]:focus, input[type="file"]:focus {
            outline: none;
            border-color: var(--btn-secondary);
        }

        input[type="file"] {
            padding: 8px 12px;
            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            background: var(--btn-secondary);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            font-weight: 600;
        }

        input[type="file"]::file-selector-button:hover {
            background: var(--btn-secondary-hover);
        }

        .or-divider {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 10px 0;
            font-weight: 500;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 110px;
            padding: 12px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #fetchButton {
            background: var(--btn-primary);
            color: white;
        }

        #fetchButton:hover:not(:disabled) {
            background: var(--btn-primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        #mergeButton {
            background: var(--btn-secondary);
            color: white;
        }

        #mergeButton:hover:not(:disabled) {
            background: var(--btn-secondary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        #downloadButton {
            background: var(--btn-tertiary);
            color: white;
        }

        #downloadButton:hover:not(:disabled) {
            background: var(--btn-tertiary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        button:disabled {
            background: var(--btn-disabled);
            cursor: not-allowed;
            opacity: 0.6;
            transform: none !important;
        }

        .preview-section {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }

        .preview-title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        .skin-previews {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .skin-preview {
            text-align: center;
        }

        .skin-preview h3 {
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .skin-canvas {
            border-radius: 8px;
            margin: 0 auto 8px;
            display: block;
            box-shadow: var(--shadow-sm);
            background: #e5e5e5; /* Fallback for older browsers */
            background: repeating-conic-gradient(#cccccc 0% 25%, #ffffff 0% 50%) 50% / 20px 20px;
            border: 2px solid var(--border-color);
        }

        [data-theme="dark"] .skin-canvas {
            background: #1a1a1a; /* Fallback for older browsers */
            background: repeating-conic-gradient(#2d3748 0% 25%, #1a202c 0% 50%) 50% / 20px 20px;
        }

        .skin-status {
            font-size: 0.85rem;
            min-height: 18px;
            margin-top: 4px;
            color: var(--text-muted);
        }

        .message-area {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        .message-area.show {
            display: block;
        }

        .loading {
            background: rgba(66, 153, 225, 0.2);
            border-left: 4px solid #4299e1;
            color: #4299e1;
        }

        .error {
            background: rgba(245, 101, 101, 0.2);
            border-left: 4px solid #f56565;
            color: #f56565;
        }

        .success {
            background: rgba(72, 187, 120, 0.2);
            border-left: 4px solid #48bb78;
            color: #48bb78;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .skin-previews {
                grid-template-columns: 1fr;
            }

            .theme-toggle {
                position: static;
                margin: 10px auto;
                width: fit-content;
            }

            header {
                padding-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Minecraft Skin Merger</h1>
            <p class="subtitle">by  Queizen30</p>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <span id="themeIcon">🌙</span>
            </button>
        </header>

        <div class="input-section">
            <div class="input-group">
                <label for="username1">
                    First Skin (Skin 1):
                    <span class="label-secondary">Enter username or upload file</span>
                </label>
                <input type="text" id="username1" placeholder="Enter Minecraft username">
                <div class="or-divider">OR</div>
                <input type="file" id="file1" accept=".png,image/png">
            </div>
            
            <div class="input-group">
                <label for="username2">
                    Second Skin (Skin 2):
                    <span class="label-secondary">Enter username or upload file</span>
                </label>
                <input type="text" id="username2" placeholder="Enter Minecraft username">
                <div class="or-divider">OR</div>
                <input type="file" id="file2" accept=".png,image/png">
            </div>
            
            <div class="button-group">
                <button id="fetchButton">Load Skins</button>
                <button id="mergeButton" disabled>Merge Skins</button>
                <button id="downloadButton" disabled>Download</button>
            </div>
            
            <div id="message" class="message-area"></div>
        </div>
        
        <div class="preview-section">
            <h2 class="preview-title">Preview</h2>
            
            <div class="skin-previews">
                <div class="skin-preview">
                    <h3>Skin 1</h3>
                    <canvas id="leftCanvas" class="skin-canvas" width="64" height="64"></canvas>
                    <div id="leftStatus" class="skin-status">No skin loaded</div>
                </div>
                
                <div class="skin-preview">
                    <h3>Merged Skin</h3>
                    <canvas id="resultCanvas" class="skin-canvas" width="64" height="64"></canvas>
                    <div id="resultStatus" class="skin-status">Awaiting merge</div>
                </div>
                
                <div class="skin-preview">
                    <h3>Skin 2</h3>
                    <canvas id="rightCanvas" class="skin-canvas" width="64" height="64"></canvas>
                    <div id="rightStatus" class="skin-status">No skin loaded</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Theme management
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const htmlElement = document.documentElement;

        // Load saved theme or default to light
        const savedTheme = localStorage.getItem('theme') || 'light';
        htmlElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        function updateThemeIcon(theme) {
            themeIcon.textContent = theme === 'light' ? '🌙' : '☀️';
        }

        // DOM elements
        const username1Input = document.getElementById('username1');
        const username2Input = document.getElementById('username2');
        const file1Input = document.getElementById('file1');
        const file2Input = document.getElementById('file2');
        const fetchButton = document.getElementById('fetchButton');
        const mergeButton = document.getElementById('mergeButton');
        const downloadButton = document.getElementById('downloadButton');
        const messageDiv = document.getElementById('message');
        
        const leftCanvas = document.getElementById('leftCanvas');
        const rightCanvas = document.getElementById('rightCanvas');
        const resultCanvas = document.getElementById('resultCanvas');
        
        const leftStatus = document.getElementById('leftStatus');
        const rightStatus = document.getElementById('rightStatus');
        const resultStatus = document.getElementById('resultStatus');
        
        // Skin images storage
        let leftSkinImg = null;
        let rightSkinImg = null;
        let mergedSkinUrl = null;

        // Complete Minecraft skin coordinate mapping
        
        // SKIN 1 (Right side perspective) - NORMAL LAYER
        const skin1_normal = [
            // Head regions
            {x: [12,15], y: [0,7]},   // Head (Top Right)
            {x: [20,23], y: [0,7]},   // Head (Bottom Right)
            {x: [12,15], y: [8,15]},  // Head (Front Right)
            {x: [16,27], y: [8,15]},  // Head (Left + Back + Right sides)
            
            // Body regions
            {x: [24,27], y: [16,19]}, // Body (Top Right)
            {x: [32,35], y: [16,19]}, // Body (Top additional)
            {x: [24,35], y: [20,31]}, // Body (Front/Back Right)
            
            // Right arm regions
            {x: [44,47], y: [20,31]}, // Right Arm (Right side)
            {x: [48,51], y: [20,31]}, // Right Arm (Front)
            {x: [52,55], y: [20,31]}, // Right Arm (Left side)
            {x: [56,59], y: [20,31]}, // Right Arm (Back)
            
            // Right leg regions
            {x: [20,27], y: [48,51]}, // Right Leg (Top overlay area)
            {x: [36,43], y: [48,51]}, // Right Leg (Additional top area)
            {x: [16,47], y: [52,63]}  // Right Leg (Full)
        ];

        // SKIN 2 (Left side perspective) - NORMAL LAYER
        const skin2_normal = [
            // Head regions
            {x: [8,11], y: [0,7]},    // Head (Top Left)
            {x: [16,19], y: [0,7]},   // Head (Bottom Left)
            {x: [8,11], y: [8,15]},   // Head (Front Left)
            {x: [0,7], y: [8,15]},    // Head (Right Side)
            {x: [28,31], y: [8,15]},  // Head (Left Side)
            
            // Body regions
            {x: [4,11], y: [16,19]},  // Body (Top Left)
            {x: [20,23], y: [16,19]}, // Body (Top center)
            {x: [44,51], y: [16,19]}, // Body (Top right)
            {x: [0,23], y: [20,31]},  // Body (Front/Back Left)
            {x: [36,55], y: [20,31]}, // Body (Additional Front/Back)
            
            // Left arm regions
            {x: [40,43], y: [20,31]}, // Left Arm (Front)
            {x: [36,39], y: [20,31]}, // Left Arm (Right side)
            {x: [32,35], y: [20,31]}, // Left Arm (Left side)
            {x: [60,63], y: [20,31]}, // Left Arm (Back)
            
            // Left leg regions (normal layer)
            {x: [4,7], y: [20,31]},   // Left Leg (Right side)
            {x: [8,11], y: [20,31]},  // Left Leg (Front)
            {x: [12,15], y: [20,31]}, // Left Leg (Left side)
            {x: [0,3], y: [20,31]}    // Left Leg (Back)
        ];

        // SKIN 1 - OVERLAY LAYER (Second layer/accessories)
        const skin1_layer = [
            // Head overlay
            {x: [44,47], y: [0,7]},   // Head Accessory (Top Right)
            {x: [52,55], y: [0,7]},   // Head Accessory (Bottom Right)
            {x: [44,59], y: [8,15]},  // Head Accessory (Front/Sides Right)
            
            // Body overlay
            {x: [24,27], y: [32,35]}, // Body Accessory (Top Right)
            {x: [32,35], y: [32,35]}, // Body Accessory (Top additional)
            {x: [24,35], y: [36,47]}, // Body Accessory (Front/Back Right)
            
            // Right arm overlay
            {x: [44,47], y: [36,47]}, // Right Arm Accessory (Right side)
            {x: [48,51], y: [36,47]}, // Right Arm Accessory (Front)
            {x: [52,55], y: [36,47]}, // Right Arm Accessory (Left side)
            {x: [56,59], y: [36,47]}, // Right Arm Accessory (Back)
            
            // Left leg overlay
            {x: [4,11], y: [48,51]},  // Left Leg Accessory (Top)
            {x: [52,59], y: [48,51]}, // Left Leg Accessory (Additional top)
            {x: [0,15], y: [52,63]},  // Left Leg Accessory (Full left)
            {x: [48,63], y: [52,63]}  // Left Leg Accessory (Full right)
        ];

        // SKIN 2 - OVERLAY LAYER (Second layer/accessories)
        const skin2_layer = [
            // Head overlay
            {x: [40,43], y: [0,7]},   // Head Accessory (Top Left)
            {x: [48,51], y: [0,7]},   // Head Accessory (Bottom Left)
            {x: [32,43], y: [8,15]},  // Head Accessory (Front/Sides Left)
            {x: [60,63], y: [8,15]},  // Head Accessory (Back Left)
            
            // Body overlay
            {x: [4,11], y: [32,35]},  // Body Accessory (Top Left)
            {x: [20,23], y: [32,35]}, // Body Accessory (Top center)
            {x: [44,51], y: [32,35]}, // Body Accessory (Top right)
            {x: [0,23], y: [36,47]},  // Body Accessory (Front/Back Left)
            {x: [36,55], y: [36,47]}, // Body Accessory (Additional Front/Back)
            
            // Left arm overlay
            {x: [40,43], y: [36,47]}, // Left Arm Accessory (Front)
            {x: [36,39], y: [36,47]}, // Left Arm Accessory (Right side)
            {x: [32,35], y: [36,47]}, // Left Arm Accessory (Left side)
            {x: [60,63], y: [36,47]}  // Left Arm Accessory (Back)
        ];

        // Event listeners
        fetchButton.addEventListener('click', loadSkins);
        mergeButton.addEventListener('click', mergeSkins);
        downloadButton.addEventListener('click', downloadSkin);
        
        // File input handlers
        file1Input.addEventListener('change', () => handleFileUpload(file1Input, 1));
        file2Input.addEventListener('change', () => handleFileUpload(file2Input, 2));

        // Handle file upload
        async function handleFileUpload(fileInput, skinNumber) {
            const file = fileInput.files[0];
            if (!file) return;

            // Validate file type
            if (!file.type.startsWith('image/png')) {
                showMessage('Please upload a PNG image file', 'error');
                fileInput.value = '';
                return;
            }

            try {
                const img = await loadImageFromFile(file);
                
                // Validate dimensions
                if ((img.width !== 64) || (img.height !== 64 && img.height !== 32)) {
                    showMessage('Skin must be 64x64 or 64x32 pixels', 'error');
                    fileInput.value = '';
                    return;
                }

                // Store and display
                if (skinNumber === 1) {
                    leftSkinImg = img;
                    drawSkin(img, leftCanvas);
                    leftStatus.textContent = `Loaded: ${file.name}`;
                    username1Input.value = ''; // Clear username input
                } else {
                    rightSkinImg = img;
                    drawSkin(img, rightCanvas);
                    rightStatus.textContent = `Loaded: ${file.name}`;
                    username2Input.value = ''; // Clear username input
                }

                // Enable merge if both skins loaded
                if (leftSkinImg && rightSkinImg) {
                    mergeButton.disabled = false;
                    showMessage('Both skins loaded! Click "Merge Skins"', 'success');
                }

            } catch (error) {
                showMessage('Error loading image: ' + error.message, 'error');
                fileInput.value = '';
            }
        }

        // Load image from file
        function loadImageFromFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = () => reject(new Error('Failed to load image'));
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(new Error('Failed to read file'));
                reader.readAsDataURL(file);
            });
        }
        
        // Load skins (username or file)
        async function loadSkins() {
            const username1 = username1Input.value.trim();
            const username2 = username2Input.value.trim();
            const hasFile1 = file1Input.files.length > 0;
            const hasFile2 = file2Input.files.length > 0;

            // Check if at least one input method is provided for each skin
            if (!username1 && !hasFile1) {
                showMessage('Please enter username or upload file for Skin 1', 'error');
                return;
            }
            if (!username2 && !hasFile2) {
                showMessage('Please enter username or upload file for Skin 2', 'error');
                return;
            }

            showMessage('Loading skins...', 'loading');
            fetchButton.disabled = true;
            
            try {
                // Load skin 1
                if (!hasFile1 && username1) {
                    leftStatus.textContent = 'Fetching...';
                    leftSkinImg = await getSkinByUsername(username1);
                    drawSkin(leftSkinImg, leftCanvas);
                    leftStatus.textContent = `Loaded: ${username1}`;
                }
                
                // Load skin 2
                if (!hasFile2 && username2) {
                    rightStatus.textContent = 'Fetching...';
                    rightSkinImg = await getSkinByUsername(username2);
                    drawSkin(rightSkinImg, rightCanvas);
                    rightStatus.textContent = `Loaded: ${username2}`;
                }
                
                showMessage('Skins loaded! Click "Merge Skins"', 'success');
                mergeButton.disabled = false;
                
            } catch (error) {
                showMessage(error.message, 'error');
            } finally {
                fetchButton.disabled = false;
            }
        }
        
        // Helper function to add timeout to fetch requests
        function fetchWithTimeout(url, timeout = 5000) {
            return Promise.race([
                fetch(url),
                new Promise((_, reject) => 
                    setTimeout(() => reject(new Error('Request timeout')), timeout)
                )
            ]);
        }

        // Validate username format
        function isValidUsername(username) {
            // Minecraft usernames are 3-16 characters, alphanumeric and underscores
            return /^[a-zA-Z0-9_]{3,16}$/.test(username);
        }

        // Get skin by username with fallback APIs
        async function getSkinByUsername(username) {
            // Validate username format
            if (!isValidUsername(username)) {
                throw new Error(`Invalid username format: "${username}". Must be 3-16 alphanumeric characters or underscores.`);
            }

            console.log(`[Skin Fetch] Starting fetch for username: ${username}`);

            // Prioritize CORS-friendly APIs first, then Mojang as fallback
            const apis = [
                {
                    name: 'mc-heads.net',
                    getUrl: (username) => `https://mc-heads.net/skin/${encodeURIComponent(username)}`,
                    timeout: 5000
                },
                {
                    name: 'Crafatar',
                    getUrl: (username) => `https://crafatar.com/skins/${encodeURIComponent(username)}`,
                    timeout: 5000
                },
                {
                    name: 'MineSkin',
                    getUrl: async (username) => {
                        const response = await fetchWithTimeout(
                            `https://api.mineskin.org/get/uuid/${encodeURIComponent(username)}`,
                            5000
                        );
                        if (!response.ok) {
                            throw new Error(`MineSkin API error: ${response.status}`);
                        }
                        const data = await response.json();
                        if (data.data && data.data.texture && data.data.texture.url) {
                            return data.data.texture.url;
                        }
                        throw new Error('No skin data in response');
                    },
                    timeout: 5000
                },
                {
                    name: 'Minotar',
                    getUrl: (username) => `https://minotar.net/skin/${encodeURIComponent(username)}`,
                    timeout: 5000
                },
                {
                    name: 'Mojang (via mc-heads proxy)',
                    getUrl: async (username) => {
                        const response = await fetchWithTimeout(
                            `https://mc-heads.net/minecraft/profile/${encodeURIComponent(username)}`,
                            8000
                        );
                        if (!response.ok) {
                            throw new Error(`Profile API error: ${response.status}`);
                        }
                        const data = await response.json();
                        if (data.properties) {
                            const textureProperty = data.properties.find(p => p.name === 'textures');
                            if (textureProperty) {
                                const textureData = JSON.parse(atob(textureProperty.value));
                                if (textureData.textures && textureData.textures.SKIN) {
                                    return textureData.textures.SKIN.url;
                                }
                            }
                        }
                        throw new Error('No skin texture in profile');
                    },
                    timeout: 8000
                },
                {
                    name: 'Mojang Direct',
                    getUrl: async (username) => {
                        try {
                            console.log(`[Mojang Direct] Fetching UUID for ${username}`);
                            // First get UUID from Mojang API
                            const uuidResponse = await fetchWithTimeout(
                                `https://api.mojang.com/users/profiles/minecraft/${encodeURIComponent(username)}`,
                                8000
                            );
                            
                            if (!uuidResponse.ok) {
                                if (uuidResponse.status === 404) {
                                    throw new Error('Username not found');
                                }
                                throw new Error(`Mojang API error: ${uuidResponse.status}`);
                            }
                            const uuidData = await uuidResponse.json();
                            console.log(`[Mojang Direct] Got UUID: ${uuidData.id}`);
                            
                            // Then get profile data
                            const profileResponse = await fetchWithTimeout(
                                `https://sessionserver.mojang.com/session/minecraft/profile/${uuidData.id}`,
                                8000
                            );
                            if (!profileResponse.ok) {
                                throw new Error(`Profile fetch failed: ${profileResponse.status}`);
                            }
                            const profileData = await profileResponse.json();
                            
                            // Decode texture data with error handling
                            const textureProperty = profileData.properties.find(p => p.name === 'textures');
                            if (!textureProperty) throw new Error('No texture data');
                            
                            let textureData;
                            try {
                                textureData = JSON.parse(atob(textureProperty.value));
                            } catch (e) {
                                throw new Error('Invalid texture data format');
                            }
                            
                            if (!textureData.textures || !textureData.textures.SKIN) {
                                throw new Error('No skin texture');
                            }
                            return textureData.textures.SKIN.url;
                        } catch (error) {
                            // Handle CORS and network errors
                            if (error.name === 'TypeError' && error.message.includes('fetch')) {
                                throw new Error('CORS blocked or network error');
                            }
                            throw error;
                        }
                    },
                    timeout: 10000
                }
            ];

            let lastError = null;
            const errors = [];

            for (const api of apis) {
                try {
                    console.log(`[Skin Fetch] Trying ${api.name}...`);
                    const startTime = Date.now();
                    
                    const skinUrl = await api.getUrl(username);
                    
                    // Load the image with timeout
                    const img = await Promise.race([
                        loadImage(skinUrl),
                        new Promise((_, reject) => 
                            setTimeout(() => reject(new Error('Image load timeout')), api.timeout || 5000)
                        )
                    ]);
                    
                    const elapsed = Date.now() - startTime;
                    console.log(`[Skin Fetch] ✓ Success with ${api.name} (${elapsed}ms)`);
                    return img;
                } catch (error) {
                    lastError = error;
                    const errorMsg = error.message || 'Unknown error';
                    errors.push({ api: api.name, error: errorMsg });
                    console.warn(`[Skin Fetch] ✗ ${api.name} failed:`, errorMsg);
                    continue;
                }
            }

            // All APIs failed - provide detailed error information
            console.error(`[Skin Fetch] All APIs failed for "${username}":`, errors);
            
            const errorMsg = lastError?.message || 'Unknown error';
            
            // Check if username was not found in any API
            const notFoundErrors = errors.filter(e => 
                e.error.includes('404') || 
                e.error.includes('not found') || 
                e.error.includes('No skin')
            );
            
            if (notFoundErrors.length >= 3) {
                throw new Error(`Username "${username}" not found. Please verify the username exists.`);
            }
            
            // Check for CORS/network issues
            const corsErrors = errors.filter(e => 
                e.error.includes('CORS') || 
                e.error.includes('blocked') ||
                e.error.includes('network') ||
                e.error.includes('timeout')
            );
            
            if (corsErrors.length === errors.length) {
                throw new Error(`Unable to fetch skin for "${username}" due to network/CORS issues. Try uploading the skin file directly.`);
            }
            
            // Generic error with details
            throw new Error(`Unable to fetch skin for "${username}". Tried ${errors.length} APIs. Last error: ${errorMsg}`);
        }
        
        // Merge skins using coordinate ranges
        function mergeSkins() {
            if (!leftSkinImg || !rightSkinImg) {
                showMessage('Please load both skins first', 'error');
                return;
            }
            
            const ctx = resultCanvas.getContext('2d');
            ctx.clearRect(0, 0, resultCanvas.width, resultCanvas.height);
            
            // Create temporary canvases
            const tempCanvas1 = document.createElement('canvas');
            const tempCanvas2 = document.createElement('canvas');
            tempCanvas1.width = tempCanvas2.width = 64;
            tempCanvas1.height = tempCanvas2.height = 64;
            
            const ctx1 = tempCanvas1.getContext('2d');
            const ctx2 = tempCanvas2.getContext('2d');
            
            // Draw and scale skins
            if (leftSkinImg.height === 32) {
                ctx1.drawImage(leftSkinImg, 0, 0, 64, 32, 0, 0, 64, 64);
            } else {
                ctx1.drawImage(leftSkinImg, 0, 0, 64, 64);
            }
            
            if (rightSkinImg.height === 32) {
                ctx2.drawImage(rightSkinImg, 0, 0, 64, 32, 0, 0, 64, 64);
            } else {
                ctx2.drawImage(rightSkinImg, 0, 0, 64, 64);
            }
            
            const skin1Data = ctx1.getImageData(0, 0, 64, 64);
            const skin2Data = ctx2.getImageData(0, 0, 64, 64);
            const resultData = ctx.createImageData(64, 64);
            
            // Initialize as transparent
            for (let i = 0; i < resultData.data.length; i += 4) {
                resultData.data[i + 3] = 0;
            }
            
            // Process skin1_normal ranges
            for (const range of skin1_normal) {
                copyRectRange(skin1Data, resultData, range.x[0], range.x[1], range.y[0], range.y[1]);
            }
            
            // Process skin2_normal ranges
            for (const range of skin2_normal) {
                copyRectRange(skin2Data, resultData, range.x[0], range.x[1], range.y[0], range.y[1]);
            }
            
            // Process overlay layers if available
            if (leftSkinImg.height === 64 && rightSkinImg.height === 64) {
                for (const range of skin1_layer) {
                    copyRectRange(skin1Data, resultData, range.x[0], range.x[1], range.y[0], range.y[1]);
                }
                for (const range of skin2_layer) {
                    copyRectRange(skin2Data, resultData, range.x[0], range.x[1], range.y[0], range.y[1]);
                }
            }
            
            ctx.putImageData(resultData, 0, 0);
            
            resultStatus.textContent = 'Merged successfully!';
            downloadButton.disabled = false;
            mergedSkinUrl = resultCanvas.toDataURL('image/png');
            showMessage('Skin merged! Click "Download" to save.', 'success');
        }
        
        // Copy rectangular range between image data
        function copyRectRange(sourceData, targetData, xStart, xEnd, yStart, yEnd) {
            for (let y = yStart; y <= yEnd; y++) {
                for (let x = xStart; x <= xEnd; x++) {
                    const sourceIndex = (y * sourceData.width + x) * 4;
                    const targetIndex = (y * targetData.width + x) * 4;
                    
                    if (sourceData.data[sourceIndex + 3] > 0) {
                        targetData.data[targetIndex] = sourceData.data[sourceIndex];
                        targetData.data[targetIndex + 1] = sourceData.data[sourceIndex + 1];
                        targetData.data[targetIndex + 2] = sourceData.data[sourceIndex + 2];
                        targetData.data[targetIndex + 3] = sourceData.data[sourceIndex + 3];
                    }
                }
            }
        }
        
        // Utility functions
        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error('Failed to load image from URL'));
                img.src = src;
            });
        }
        
        function drawSkin(img, canvas) {
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (img.width === 64 && img.height === 32) {
                ctx.drawImage(img, 0, 0, 64, 32, 0, 0, 64, 64);
            } else {
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            }
        }
        
        function downloadSkin() {
            if (!mergedSkinUrl) return;
            const link = document.createElement('a');
            link.download = 'merged_skin.png';
            link.href = mergedSkinUrl;
            link.click();
        }
        
        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message-area ${type} show`;
            
            // Add spinner for loading messages
            if (type === 'loading') {
                const spinner = document.createElement('span');
                spinner.className = 'spinner';
                messageDiv.insertBefore(spinner, messageDiv.firstChild);
            }
        }
    </script>
</body>
